
name: Go CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workout
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: workout_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workout -d workout_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://workout:devpassword@localhost:5432/workout_tracker_test?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Run static analysis
        run: go vet ./...

      - name: Apply database schema
        run: |
          PGPASSWORD=devpassword psql \
            -h localhost \
            -U workout \
            -d workout_tracker_test \
            -v ON_ERROR_STOP=1 \
            -f migrations/001_initial_schema.up.sql

      - name: Run tests
        run: go test ./...

      - name: Build application
        run: go build ./...
